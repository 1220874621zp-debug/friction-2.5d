name: Development Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------- Linux AppImage 构建 -----------------
  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set Head Repo URL Environment Variable
        if: github.event_name == 'pull_request'
        run: |
          echo "HEAD_REPO_URL=${{ github.event.pull_request.head.repo.clone_url }}" >> $GITHUB_ENV
          echo "COMMIT=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          echo "BRANCH=NONE" >> $GITHUB_ENV
      - name: Build with Qt6
        run: APT=1 CI=1 QT6=ON MKJOBS=2 ./src/scripts/ci.sh
      - name: Install to AppDir
        run: |
          mkdir -p AppDir
          DESTDIR=AppDir cmake --install build-ci
      - name: Build AppImage
        run: |
          sudo apt install -y libfuse2
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export PATH=$(dirname $(readlink -f $(which qmake6))):$PATH
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            -d src/app/xdg/friction.desktop \
            -i src/app/icons/hicolor/256x256/apps/graphics.friction.Friction.png
          mkdir -p ci-artifacts
          mv *.AppImage ci-artifacts/ || true
      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friction-Linux-AppImage
          path: ci-artifacts/*.AppImage
          if-no-files-found: error

  # ----------------- Linux DEB 构建 -----------------
  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build DEB Package
        run: APT=1 CI=1 QT6=ON MKJOBS=2 ./src/scripts/ci.sh
      - name: Prepare Artifact
        run: |
          mkdir -p ci-artifacts
          cp build-ci/*.deb ci-artifacts/
      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friction-Linux-DEB
          path: ci-artifacts/*.deb
          if-no-files-found: error

  # ----------------- Windows 构建 -----------------
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true
      - name: Build QScintilla2 (Qt6)
        shell: cmd
        run: |
          curl -sL -o qsci.tar.gz https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz
          tar xf qsci.tar.gz
          cd QScintilla_src-2.14.1\src
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          "%QT_ROOT_DIR%\bin\qmake.exe" qscintilla.pro CONFIG+=release
          nmake
          echo QSCINTILLA_DIR=%cd%>>%GITHUB_ENV%
      - name: Build Windows Package
        shell: cmd
        run: .\src\scripts\build.bat ci
      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-artifacts
          Copy-Item build\output\friction-*.7z ci-artifacts\
          Copy-Item build\output\friction-*-setup-win64.exe ci-artifacts\
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: friction-Windows-x64
          path: |
            ci-artifacts/*.7z
            ci-artifacts/*.exe
          if-no-files-found: error

  # ----------------- macOS 构建 -----------------
  build-macos:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt6 + QScintilla2
        run: |
          brew install qt@6
          curl -sL -o /tmp/qsci.tar.gz https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz
          tar xf /tmp/qsci.tar.gz -C /tmp
          cd /tmp/QScintilla_src-2.14.1/src
          "$(brew --prefix qt@6)/bin/qmake" qscintilla.pro CONFIG+=release
          make -j3
      - name: Build macOS DMG (arm64)
        run: |
          export QT6_PREFIX="$(brew --prefix qt@6)"
          export QSCINTILLA_DIR=/tmp/QScintilla_src-2.14.1/src
          export PATH="$QT6_PREFIX/bin:$PATH"
          BUILD_INTEL=0 BUILD_UNIVERSAL=0 ./src/scripts/build_mac_ci.sh
      - name: Prepare Artifact
        run: |
          mkdir -p ci-artifacts
          cp build-release-universal/*.dmg ci-artifacts/ 2>/dev/null || true
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friction-macOS-Universal
          path: ci-artifacts/*.dmg
          if-no-files-found: ignore


