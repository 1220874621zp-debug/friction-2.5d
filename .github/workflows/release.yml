name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ----------------- Linux AppImage 构建 -----------------
  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build AppImage (Release)
        run: REL=1 ./src/scripts/build.sh
      - name: Prepare Artifact
        run: |
          mkdir -p ci-artifacts
          cp distfiles/builds/*/*.AppImage ci-artifacts/
      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friction-Linux-AppImage
          path: ci-artifacts/*.AppImage
          if-no-files-found: error

  # ----------------- Linux DEB 构建 -----------------
  build-linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build DEB Package (Release)
        run: APT=1 CI=1 REL=1 MKJOBS=2 ./src/scripts/ci.sh
      - name: Prepare Artifact
        run: |
          mkdir -p ci-artifacts
          cp build-ci/*.deb ci-artifacts/
      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friction-Linux-DEB
          path: ci-artifacts/*.deb
          if-no-files-found: error

  # ----------------- Windows 构建 -----------------
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Windows Package (Release)
        shell: cmd
        run: .\src\scripts\build.bat release
      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-artifacts
          Copy-Item build\output\friction-*.7z ci-artifacts\
          Copy-Item build\output\friction-*-setup-win64.exe ci-artifacts\
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: friction-Windows-x64
          path: |
            ci-artifacts/*.7z
            ci-artifacts/*.exe
          if-no-files-found: error

  # ----------------- macOS 构建 -----------------
  build-macos:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build macOS DMG (Release)
        run: REL=ON ./src/scripts/build_mac_ci.sh
      - name: Prepare Artifact
        run: |
          mkdir -p ci-artifacts
          cp build-release-universal/*.dmg ci-artifacts/ 2>/dev/null || true
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friction-macOS-Universal
          path: ci-artifacts/*.dmg
          if-no-files-found: ignore

  # ----------------- Release 自动发布 -----------------
  release:
    needs: [build-linux-appimage, build-linux-deb, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            VERSION=$(cat version.txt | tr -d '\r\n')
            TAG_NAME="v$VERSION"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          make_latest: true
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
